[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "python-dotenv>=1.0.0",
  "pyyaml>=6.0.1",
  "pypdf>=5.0.0",
  "cryptography>=41.0.0",
  "sentence-transformers>=2.7.0",
  "qdrant-client>=1.10.0",
  "httpx>=0.27.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
